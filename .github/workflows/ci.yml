name: ApexGuard CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-format:
    name: Prettier Formatting Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install devDependencies
        run: npm install --no-audit --no-fund

      - name: Check formatting with Prettier
        run: npx prettier --check "force-app/**/*.{cls,trigger}" "sfdx-project.json" "package.json" "skills.sh.json" "config/*.json"

  sfdx-structure-check:
    name: SFDX Metadata & Org Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate sfdx-project.json, Apex meta XML companions, ApexTestSuite, and AI Agent Skills
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const cfg = JSON.parse(fs.readFileSync('sfdx-project.json', 'utf8'));
            if (!cfg.packageDirectories || !cfg.sourceApiVersion) {
              throw new Error('Invalid sfdx-project.json');
            }
            console.log('Validated sfdx-project.json (API v' + cfg.sourceApiVersion + ')');

            const suitePath = path.join('force-app', 'main', 'default', 'testSuites', 'ApexGuard.testSuite-meta.xml');
            if (!fs.existsSync(suitePath)) {
              throw new Error('Missing ApexTestSuite metadata: ' + suitePath);
            }
            const suiteXml = fs.readFileSync(suitePath, 'utf8');
            const suiteMembers = new Set(
              Array.from(suiteXml.matchAll(/<testClassName>\s*([A-Za-z0-9_]+)\s*<\/testClassName>/g), (m) => m[1])
            );
            const testsDir = path.join('force-app', 'main', 'default', 'classes', 'tests');
            const testClasses = fs
              .readdirSync(testsDir)
              .filter((file) => file.endsWith('Test.cls'))
              .map((file) => file.replace(/\.cls$/, ''));
            const missingFromSuite = testClasses.filter((cls) => !suiteMembers.has(cls));
            if (missingFromSuite.length > 0) {
              throw new Error('ApexTestSuite ApexGuard is missing test classes: ' + missingFromSuite.join(', '));
            }
            console.log('Validated ApexGuard.testSuite-meta.xml covers all ' + testClasses.length + ' test classes.');

            // Validate skills.sh.json and skills/*/SKILL.md frontmatter
            const skillsReadme = path.join('skills', 'README.md');
            if (!fs.existsSync(skillsReadme)) {
              throw new Error('Missing skills catalog README: ' + skillsReadme);
            }
            const skillsCfg = JSON.parse(fs.readFileSync('skills.sh.json', 'utf8'));
            if (!Array.isArray(skillsCfg.groupings) || skillsCfg.groupings.length === 0) {
              throw new Error('skills.sh.json must define non-empty groupings.');
            }
            const catalogSkills = new Set();
            for (const group of skillsCfg.groupings) {
              for (const skillId of group.skills || []) {
                catalogSkills.add(skillId);
                const skillMdPath = path.join('skills', skillId, 'SKILL.md');
                if (!fs.existsSync(skillMdPath)) {
                  throw new Error('Missing SKILL.md for skill in skills.sh.json: ' + skillMdPath);
                }
                const skillContent = fs.readFileSync(skillMdPath, 'utf8');
                const fmMatch = skillContent.match(/^---\r?\n([\s\S]*?)\r?\n---/);
                if (!fmMatch) {
                  throw new Error('Missing YAML frontmatter in ' + skillMdPath);
                }
                const nameMatch = fmMatch[1].match(/^name:\s*(.+)$/m);
                const descMatch = fmMatch[1].match(/^description:\s*(.+)$/m);
                if (!nameMatch || nameMatch[1].trim() !== skillId) {
                  throw new Error('Frontmatter name mismatch in ' + skillMdPath);
                }
                if (!descMatch || !descMatch[1].trim()) {
                  throw new Error('Missing frontmatter description in ' + skillMdPath);
                }
              }
            }
            const skillDirs = fs
              .readdirSync('skills', { withFileTypes: true })
              .filter((d) => d.isDirectory() && fs.existsSync(path.join('skills', d.name, 'SKILL.md')))
              .map((d) => d.name);
            const ungrouped = skillDirs.filter((dir) => !catalogSkills.has(dir));
            if (ungrouped.length > 0) {
              throw new Error('Skills missing from skills.sh.json: ' + ungrouped.join(', '));
            }
            console.log('Validated skills.sh.json and ' + catalogSkills.size + ' SKILL.md definitions.');
          "
          missing=0
          while IFS= read -r cls; do
            if [ ! -f "${cls}-meta.xml" ]; then
              echo "::error file=${cls}::Missing companion ${cls}-meta.xml"
              missing=1
            fi
          done < <(find force-app -type f -name '*.cls')
          exit "$missing"

      - name: Setup Java 21 for Salesforce Code Analyzer
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js for Salesforce CLI
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Salesforce CLI & Code Analyzer
        run: |
          npm install -g @salesforce/cli
          sf plugins install @salesforce/plugin-code-analyzer

      - name: Run Salesforce Code Analyzer
        run: sf code-analyzer run --workspace force-app --severity-threshold 2

      - name: Deploy & run Apex tests in target org (optional)
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          if [ -z "$SFDX_AUTH_URL" ]; then
            echo "Skipping org deploy and Apex tests: SFDX_AUTH_URL secret is not configured."
            exit 0
          fi
          printf '%s' "$SFDX_AUTH_URL" > sfdx-auth.txt
          sf org login sfdx-url --sfdx-url-file sfdx-auth.txt --alias ci-org --set-default
          rm -f sfdx-auth.txt
          sf project deploy start --source-dir force-app --target-org ci-org --wait 10
          sf apex run test --suite-names ApexGuard --code-coverage --result-format human --wait 10 --target-org ci-org
