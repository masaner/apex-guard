<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" role="img" aria-labelledby="apexguard-title apexguard-desc">
  <title id="apexguard-title">ApexGuard — Fail-Fast, Context-Aware Guard Clauses for Salesforce Apex</title>
  <desc id="apexguard-desc">Hero banner for ApexGuard, a zero-dependency open-source Apex Guard Clause library supporting Services, Triggers, LWC, Flows, Agentforce, REST APIs, and Async Apex.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070D19" />
      <stop offset="55%" stop-color="#0D192E" />
      <stop offset="100%" stop-color="#0A2239" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A1E0" />
      <stop offset="55%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A1E0" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <radialGradient id="glowLeft" cx="22%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#00A1E0" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#00A1E0" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowRight" cx="84%" cy="68%" r="42%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <pattern id="gridPattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#38BDF8" stroke-opacity="0.07" stroke-width="1" />
    </pattern>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Main Banner Card -->
  <rect x="2" y="2" width="1196" height="316" rx="18" fill="url(#bgGrad)" stroke="#1E3A5F" stroke-width="2" />
  <rect x="2" y="2" width="1196" height="316" rx="18" fill="url(#gridPattern)" />
  <rect x="2" y="2" width="1196" height="316" rx="18" fill="url(#glowLeft)" />
  <rect x="2" y="2" width="1196" height="316" rx="18" fill="url(#glowRight)" />

  <!-- Shield Emblem (Left) -->
  <g transform="translate(48, 72)">
    <path d="M56 4 L108 24 V74 C108 111 84 140 56 154 C28 140 4 111 4 74 V24 Z"
          fill="#0B162B" stroke="url(#shieldGrad)" stroke-width="4" filter="url(#softGlow)" />
    <path d="M56 18 L94 33 V73 C94 102 76 125 56 137 C36 125 18 102 18 73 V33 Z"
          fill="url(#shieldGrad)" fill-opacity="0.14" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.5" />
    <!-- Code Brackets & Checkmark Inside Shield -->
    <path d="M35 66 L26 75 L35 84" fill="none" stroke="#7DD3FC" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M77 66 L86 75 L77 84" fill="none" stroke="#7DD3FC" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M44 76 L53 85 L69 65" fill="none" stroke="#34D399" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Title & Tagline -->
  <g transform="translate(182, 66)">
    <text x="0" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="48" font-weight="800" fill="#F8FAFC" letter-spacing="-0.8">
      Apex<tspan fill="#38BDF8">Guard</tspan>
    </text>
    <rect x="2" y="48" width="116" height="4" rx="2" fill="url(#accentLine)" />

    <text x="0" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#CBD5E1">
      Fail-Fast, Context-Aware Guard Clauses for Salesforce Apex
    </text>
    <text x="0" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#94A3B8">
      Inspired by .NET CommunityToolkit.Diagnostics.Guard — built natively for Salesforce
    </text>

    <!-- Feature Pill Badges -->
    <g transform="translate(0, 134)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600">
      <rect x="0" y="0" width="136" height="26" rx="13" fill="#0F2942" stroke="#00A1E0" stroke-opacity="0.5" />
      <circle cx="13" cy="13" r="3.5" fill="#34D399" />
      <text x="23" y="17" fill="#E0F2FE">Zero Dependencies</text>

      <rect x="144" y="0" width="122" height="26" rx="13" fill="#0F2942" stroke="#00A1E0" stroke-opacity="0.5" />
      <circle cx="157" cy="13" r="3.5" fill="#38BDF8" />
      <text x="167" y="17" fill="#E0F2FE">0 SOQL / 0 DML</text>

      <rect x="274" y="0" width="132" height="26" rx="13" fill="#0F2942" stroke="#00A1E0" stroke-opacity="0.5" />
      <circle cx="287" cy="13" r="3.5" fill="#A78BFA" />
      <text x="297" y="17" fill="#E0F2FE">LWC &amp; Aura Ready</text>

      <rect x="414" y="0" width="136" height="26" rx="13" fill="#0F2942" stroke="#00A1E0" stroke-opacity="0.5" />
      <circle cx="427" cy="13" r="3.5" fill="#FBBF24" />
      <text x="437" y="17" fill="#E0F2FE">Flow &amp; Agentforce</text>

      <rect x="0" y="36" width="136" height="26" rx="13" fill="#0F2942" stroke="#10B981" stroke-opacity="0.45" />
      <circle cx="13" cy="49" r="3.5" fill="#34D399" />
      <text x="23" y="53" fill="#D1FAE5">Trigger addError()</text>

      <rect x="144" y="36" width="148" height="26" rx="13" fill="#0F2942" stroke="#10B981" stroke-opacity="0.45" />
      <circle cx="157" cy="49" r="3.5" fill="#38BDF8" />
      <text x="167" y="53" fill="#D1FAE5">Nebula Logger Hook</text>

      <rect x="300" y="36" width="114" height="26" rx="13" fill="#0F2942" stroke="#10B981" stroke-opacity="0.45" />
      <circle cx="313" cy="49" r="3.5" fill="#F472B6" />
      <text x="323" y="53" fill="#D1FAE5">REST &amp; Async</text>
    </g>
  </g>

  <!-- Right-Side Code Window Preview -->
  <g transform="translate(766, 36)">
    <rect x="0" y="0" width="394" height="248" rx="12" fill="#060B14" stroke="#1E293B" stroke-width="1.5" />
    <!-- Window Title Bar -->
    <rect x="0" y="0" width="394" height="30" rx="12" fill="#0F172A" />
    <rect x="0" y="18" width="394" height="12" fill="#0F172A" />
    <line x1="0" y1="30" x2="394" y2="30" stroke="#1E293B" stroke-width="1" />
    <circle cx="18" cy="15" r="5" fill="#EF4444" fill-opacity="0.85" />
    <circle cx="34" cy="15" r="5" fill="#F59E0B" fill-opacity="0.85" />
    <circle cx="50" cy="15" r="5" fill="#10B981" fill-opacity="0.85" />
    <text x="206" y="19" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" fill="#94A3B8">OrderService.cls — API v62.0</text>

    <!-- Syntax Highlighted Code Lines -->
    <g transform="translate(18, 52)" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12">
      <text x="0" y="0" fill="#64748B">// 1. Validate &amp; assign in one line</text>
      <text x="0" y="19">
        <tspan fill="#38BDF8">Id</tspan>
        <tspan fill="#E2E8F0"> acctId = </tspan>
        <tspan fill="#34D399" font-weight="700">Guard</tspan>
        <tspan fill="#E2E8F0">.isIdOfType(</tspan>
      </text>
      <text x="14" y="37">
        <tspan fill="#34D399" font-weight="700">Guard</tspan>
        <tspan fill="#E2E8F0">.isValidId(rawId, </tspan>
        <tspan fill="#FBBF24">'rawId'</tspan>
        <tspan fill="#E2E8F0">),</tspan>
      </text>
      <text x="14" y="55">
        <tspan fill="#F472B6">Account</tspan>
        <tspan fill="#E2E8F0">.SObjectType, </tspan>
        <tspan fill="#FBBF24">'rawId'</tspan>
      </text>
      <text x="0" y="73" fill="#E2E8F0">);</text>

      <text x="0" y="99" fill="#64748B">// 2. Enforce numeric preconditions</text>
      <text x="0" y="118">
        <tspan fill="#34D399" font-weight="700">Guard</tspan>
        <tspan fill="#E2E8F0">.isGreaterThan(amt, </tspan>
        <tspan fill="#A78BFA">0</tspan>
        <tspan fill="#E2E8F0">, </tspan>
        <tspan fill="#FBBF24">'amt'</tspan>
        <tspan fill="#E2E8F0">);</tspan>
      </text>

      <text x="0" y="144" fill="#64748B">// 3. Trigger UI field highlighting</text>
      <text x="0" y="163">
        <tspan fill="#34D399" font-weight="700">Guard</tspan>
        <tspan fill="#E2E8F0">.onRecord(opp).isNotBlank(</tspan>
      </text>
      <text x="14" y="181">
        <tspan fill="#F472B6">Opportunity</tspan>
        <tspan fill="#E2E8F0">.Name, </tspan>
        <tspan fill="#FBBF24">'Name is required.'</tspan>
        <tspan fill="#E2E8F0">);</tspan>
      </text>
    </g>
  </g>
</svg>
